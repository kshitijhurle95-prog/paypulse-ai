services:
  # 1. Main Next.js Full-Stack Web Application (Free Tier)
  - type: web
    name: paypulse-ai
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: GROK_MODEL
        value: grok-4.7
      - key: GROQ_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_AG_GRID_LICENSE_KEY
        value: "[TRIAL]_this_{AG_Studio_Pro}_Enterprise_key_{AG-149437}_is_granted_for_evaluation_only___Use_in_production_is_not_permitted___Please_report_misuse_to_legal@ag-grid.com___For_help_with_purchasing_a_production_key_please_contact_info@ag-grid.com___You_are_granted_a_{Single_Application}_Developer_License_for_one_application_only___All_Front-End_JavaScript_developers_working_on_the_application_would_need_to_be_licensed___This_key_will_deactivate_on_{11 December 2026}____[v3]_[03C]_MTc5Njk0NzIwMDAwMA==3a37e16692e0044c396c8bd28c098465"
      - key: ZAPIER_WEBHOOK_URL
        sync: false

