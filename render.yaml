services:
  - type: web
    name: paypulse-ai
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: GROK_MODEL
        value: grok-4.7
      - key: XAI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ZAPIER_WEBHOOK_URL
        sync: false
